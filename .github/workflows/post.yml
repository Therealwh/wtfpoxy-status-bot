name: Post status to channel

# Триггерится cron-job.org (12:00 и 21:00 МСК = 09:00 и 18:00 UTC)
# либо вручную с вкладки Actions. См. README.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send status post
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # необязательно: ключ публичного API панели (scope read)
          PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
        run: python status_post.py
